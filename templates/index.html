<!DOCTYPE html>
<html>
<head>
  <title>Tasks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #efefef;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    h1 {
      color: #58bc82;
    }

    .form {
      --bg-light: #efefef;
      --bg-dark: #707070;
      --clr: #58bc82;
      --clr-alpha: #9c9c9c60;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
      margin-bottom: 30px;
    }

    .form input, .form textarea {
      border-radius: 0.5rem;
      padding: 0.75rem;
      border: none;
      background-color: var(--clr-alpha);
      outline: 2px solid var(--bg-dark);
      width: 100%;
    }

    .form input:focus, .form textarea:focus {
      outline: 2px solid var(--clr);
    }

    .submit {
      padding: 0.75rem;
      border-radius: 3rem;
      background-color: #707070;
      color: #efefef;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .submit:hover {
      background-color: #58bc82;
      color: #707070;
    }

    .task {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      width: 400px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .done {
      text-decoration: line-through;
      color: gray;
    }

    .actions a {
      margin-right: 10px;
      text-decoration: none;
      font-size: 0.9rem;
      color: #58bc82;
      font-weight: bold;
    }

    .actions a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>My Tasks</h1>

    <h1>Hei {{ username }}, hva skal vi gjøre i dag?</h1>

  <form method="POST" action="/add" class="form">
    <input type="text" name="title" placeholder="Task title" required>
    <textarea name="description" placeholder="Description"></textarea>
    <input class="submit" type="submit" value="Add Task">
  </form>

 
  {% for task in tasks %}
    <div class="task">
      <h3 class="{% if task.is_done %}done{% endif %}">
        {{ task.title }}
      </h3>
      <p class="{% if task.is_done %}done{% endif %}">
        {{ task.description }}
      </p>

      <div class="actions">
        <a href="/done/{{ task.id }}">Done</a>
        <a href="/delete/{{ task.id }}">Delete</a>
      </div>
    </div>
  {% endfor %}

</body>
</html>
